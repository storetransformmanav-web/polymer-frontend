<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymer CRM</title>
    <!--
      Set [data-theme] before first paint so the stored/default theme
      doesn't flash the wrong mode while React hydrates. Light is the
      default (not the OS preference) unless the user explicitly picks
      'dark' or 'system'. Keep this in sync with src/hooks/useTheme.js.
    -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('polymer-crm:theme')
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          } else if (theme !== 'system') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (error) {
          // localStorage unavailable — default to light.
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
